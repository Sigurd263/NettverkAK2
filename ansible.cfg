[defaults]
# Kjør Ansible fra mappen som inneholder denne filen og hosts.ini.
inventory = hosts.ini
# For isolert skolelab: ikke krev forhåndslagrede vertsnøkler.
host_key_checking = False
retry_files_enabled = False

[persistent_connection]
# Gi fysisk Cisco-utstyr tid til tilkobling og kommandoer.
connect_timeout = 60
command_timeout = 60
