# SSH-adresser i administrasjonsnettet 10.1.0.0/24 (VLAN 99).
# Adressene må være tilgjengelige før Ansible kan koble til.
MSW1 ansible_host=10.1.0.100
R1 ansible_host=10.1.0.2
R2 ansible_host=10.1.0.3
SW2 ansible_host=10.1.0.101
SW3 ansible_host=10.1.0.102

[all:vars]
ansible_connection=ansible.netcommon.network_cli
ansible_network_os=cisco.ios.ios
ansible_network_cli_ssh_type=paramiko
# Eksisterende labbruker. Bytt dersom utstyret bruker andre innloggingsdata.
ansible_user=cisco
ansible_password=cisco
